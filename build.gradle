plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fikry.demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.fikry.demo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies are needed: the app uses only the Android framework.
dependencies {
}
